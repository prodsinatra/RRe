name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # The Firestore emulator, which npm run test:rules drives, is a Java
      # process. Pinned rather than relying on whatever the runner image ships.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Typecheck, domain tests, Firestore rules tests, and both builds.
      # These must stay free of cloud credentials: the domain tests cover the
      # rule engine, state machine, audio diagnostics, SSRF guard and canonical
      # JSON, and the rules tests run against the local emulator on a demo
      # project id. Nothing here touches a real Firebase project.
      - run: npm run check
