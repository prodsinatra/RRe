name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck, domain tests, and both builds.
      # These must stay free of backend credentials: the domain tests cover the
      # rule engine, state machine, audio diagnostics, SSRF guard and canonical
      # JSON, none of which should need a database to run.
      - run: npm run check
